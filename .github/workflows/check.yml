name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/recipes.json
        run: python3 build.py --check
      - name: index.html is up to date
        run: |
          python3 build.py
          if ! git diff --quiet -- index.html sw.js; then
            echo "::error file=index.html::index.html or sw.js is stale. Run 'python3 build.py' and commit the result."
            exit 1
          fi
